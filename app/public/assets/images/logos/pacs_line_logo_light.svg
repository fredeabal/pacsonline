<svg xmlns="http://www.w3.org/2000/svg" width="780" height="210" viewBox="0 0 780 210">
  <defs>
    <filter id="glow-light" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style type="text/css">
      

      .logo-text {
        fill: #202a2f;
        font-family: 'Poppins', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 138px;
        letter-spacing: -3px;
      }

      .swirl-group {
        transform-origin: 58px 115px;
        animation: swirl-in 1.3s cubic-bezier(0.22, 1, 0.36, 1) 1 forwards;
      }

      .cls-2 {
        fill: #5d87ff;
        opacity: 0;
        animation: dot-arrive 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 1 forwards;
      }

      .dot-1 { animation-delay: 0.05s; }
      .dot-2 { animation-delay: 0.15s; }
      .dot-4 { animation-delay: 0.25s; }
      .dot-3 { animation-delay: 0.35s; }
      .dot-5 { animation-delay: 0.45s; }

      @keyframes swirl-in {
        0% { transform: rotate(-270deg) scale(0.25); }
        75% { transform: rotate(10deg) scale(1.03); }
        100% { transform: rotate(0deg) scale(1); }
      }

      @keyframes dot-arrive {
        0% { r: 3px; opacity: 0; fill: #93b4ff; }
        60% { r: 17px; opacity: 1; fill: #2563eb; filter: url(#glow-light); }
        100% { r: 14.5px; opacity: 1; fill: #5d87ff; filter: none; }
      }
    </style>
  </defs>
  <title>pacsline light</title>
  <g>
    <g class="swirl-group">
      <circle cx="32" cy="60" r="14.5" class="cls-2 dot-1" />
      <circle cx="84" cy="60" r="14.5" class="cls-2 dot-2" />
      <circle cx="32" cy="115" r="14.5" class="cls-2 dot-3" />
      <circle cx="84" cy="115" r="14.5" class="cls-2 dot-4" />
      <circle cx="32" cy="170" r="14.5" class="cls-2 dot-5" />
    </g>
    <text x="145" y="148" class="logo-text">pacsline</text>
  </g>
</svg>