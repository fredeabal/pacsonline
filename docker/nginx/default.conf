server {
    listen 80;
    server_name _;

    client_max_body_size 512M;

    root /var/www/html/public;
    index index.php index.html;

    # Portal PHP / CodeIgniter 4
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 300;
    }

    # Visor médico OHIF
    location ^~ /viewer/ {
        proxy_pass http://ohif:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Archivos estáticos y bundles de OHIF en raíz (cuando routerBasename es /viewer)
    location ~* ^/(app-config\.js|manifest\.json|init-service-worker\.js|sw\.js|polyfill\.min\.js|oidc-client\.min\.js|es6-shim\.min\.js|google\.js|ohif-logo.*\.svg|[^/]+\.bundle\.[^/]+|[0-9]+\.css|[a-f0-9]+\.(woff2?|wasm)|(ort|dicom-microscopy-viewer|customizations)/.*|assets/(favicon.*|coast.*))$ {
        proxy_pass http://ohif:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Subrequest interno de autorización hacia CodeIgniter 4
    location = /_dicom_auth {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /_dicom_auth;
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_pass_request_body off;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_pass php:9000;
    }

    # Evita que OHIF cargue otros estudios del mismo paciente en el panel lateral
    location = /dicom-web/studies {
        auth_request /_dicom_auth;
        if ($arg_00100020 != "") {
            add_header Content-Type application/json;
            return 200 "[]";
        }
        proxy_pass http://orthanc:8042/dicom-web/studies;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
    }

    # Proxy DICOMweb hacia Orthanc protegido por CodeIgniter 4
    location /dicom-web/ {
        auth_request /_dicom_auth;
        proxy_pass http://orthanc:8042/dicom-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
    }

    # Bloquear acceso a archivos ocultos
    location ~ /\. {
        deny all;
    }
}
